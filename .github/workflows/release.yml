name: Release APK

# Every push and PR builds the optimised APK, which is then rebuilt in F-Droid's own build environment and
# must match byte for byte (reproducible builds). A push to master whose versionName (app/build.gradle.kts)
# has no v<versionName> tag yet is a release: once reproduced, the signed APK is published as a GitHub
# Release, which also creates the tag. F-Droid builds that tag and ships our APK.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a master build: it may be publishing a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    name: just release-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version-name: ${{ steps.version.outputs.name }}
      version-code: ${{ steps.version.outputs.code }}
      release: ${{ steps.version.outputs.release }}
      signed: ${{ steps.signing.outputs.signed }}
    env:
      KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags are needed to tell whether this version was released already.
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install just
        run: sudo apt-get update && sudo apt-get install --yes just

      - name: Determine version
        id: version
        run: |
          code=$(sed -nE 's/^ *versionCode = ([0-9]+)$/\1/p' app/build.gradle.kts)
          name=$(sed -nE 's/^ *versionName = "([^"]+)"$/\1/p' app/build.gradle.kts)
          if [ -z "$code" ] || [ -z "$name" ]; then
            echo "::error::versionCode/versionName not found in app/build.gradle.kts"
            exit 1
          fi
          release=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/master ] \
              && ! git rev-parse -q --verify "refs/tags/v$name" > /dev/null; then
            release=true
            previous=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
            if [ -n "$previous" ]; then
              previous_code=$(git show "$previous:app/build.gradle.kts" | sed -nE 's/^ *versionCode = ([0-9]+)$/\1/p')
              if [ "$code" -le "$previous_code" ]; then
                echo "::error::versionCode $code must be greater than $previous_code of $previous"
                exit 1
              fi
            fi
            if [ ! -f "fastlane/metadata/android/en-US/changelogs/$code.txt" ]; then
              echo "::error::Missing fastlane/metadata/android/en-US/changelogs/$code.txt for the release notes"
              exit 1
            fi
          fi
          echo "Version $name ($code), release: $release"
          {
            echo "name=$name"
            echo "code=$code"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

      # Actions secrets are unavailable to pull requests from forks and from Dependabot: those build an
      # unsigned APK, which still goes through R8, resource shrinking and the reproducibility check below.
      # Never copy the keystore into Dependabot secrets: that hands it to freshly bumped build code.
      # Releases must be signed.
      - name: Set up signing key
        id: signing
        env:
          RELEASE: ${{ steps.version.outputs.release }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$RELEASE" = true ]; then
              echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing; refusing to publish an unsigned release"
              exit 1
            fi
            echo "::warning::No signing key available; building an unsigned APK"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build optimised APK
        run: just release-apk

      - name: Collect outputs
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          mkdir dist
          suffix=$([ -n "${RELEASE_KEYSTORE:-}" ] || echo "-unsigned")
          cp app/build/outputs/apk/release/app-release*.apk "dist/jigsaw-${VERSION_NAME}${suffix}.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-${VERSION_NAME}.txt"
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jigsaw-${{ steps.version.outputs.name }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  reproducible:
    name: reproduce in F-Droid's build environment
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # The image F-Droid's build server runs (Debian trixie, the Android SDK in /opt/android-sdk). Its default
    # JDK is trixie's OpenJDK 21; the build installs OpenJDK 25 from trixie, as the F-Droid recipe does.
    container: registry.gitlab.com/fdroid/fdroidserver:buildserver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jigsaw-${{ needs.apk.outputs.version-name }}-${{ github.sha }}
          path: dist

      - name: Install OpenJDK 25
        run: |
          apt-get update
          apt-get install --yes openjdk-25-jdk-headless
          update-java-alternatives --set java-1.25.0-openjdk-amd64

      - name: Rebuild without signing key
        run: |
          . /etc/profile.d/bsenv.sh
          java -version
          ./gradlew :app:assembleRelease --no-daemon --console=plain

      # Signed: copy our signature onto the rebuilt APK and require the result to equal the signed one.
      # Unsigned (fork and Dependabot PRs): both APKs come out of the same unsigned path, so compare bytes.
      - name: Compare with the CI-built APK
        id: compare
        env:
          SIGNED: ${{ needs.apk.outputs.signed }}
          VERSION_NAME: ${{ needs.apk.outputs.version-name }}
        run: |
          rebuilt=app/build/outputs/apk/release/app-release-unsigned.apk
          if [ "$SIGNED" = true ]; then
            apt-get update && apt-get install --yes apksigcopier
            apksigcopier compare "dist/jigsaw-$VERSION_NAME.apk" --unsigned "$rebuilt"
          else
            cmp "dist/jigsaw-$VERSION_NAME-unsigned.apk" "$rebuilt"
          fi

      # Show what differs (zip entries, dex code), so a dependency bump that breaks reproducibility can be
      # diagnosed from the log. For signed builds the signature files in META-INF differ as well.
      - name: Show differences
        if: failure() && steps.compare.outcome == 'failure'
        env:
          SIGNED: ${{ needs.apk.outputs.signed }}
          VERSION_NAME: ${{ needs.apk.outputs.version-name }}
        run: |
          apt-get update && apt-get install --yes --no-install-recommends diffoscope-minimal unzip dexdump
          suffix=$([ "$SIGNED" = true ] || echo "-unsigned")
          diffoscope "dist/jigsaw-$VERSION_NAME$suffix.apk" app/build/outputs/apk/release/app-release-unsigned.apk || true

  publish:
    name: publish GitHub Release
    needs: [apk, reproducible]
    if: needs.apk.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Creating the release tag and GitHub Release.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jigsaw-${{ needs.apk.outputs.version-name }}-${{ github.sha }}
          path: dist

      - name: Create release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.apk.outputs.version-name }}
          VERSION_CODE: ${{ needs.apk.outputs.version-code }}
        run: |
          gh release create "v$VERSION_NAME" dist/* \
            --target "$GITHUB_SHA" \
            --title "v$VERSION_NAME" \
            --notes-file "fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt"
